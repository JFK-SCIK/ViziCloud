<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="Album photo partagé iCloud">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ViziCloud">
  <title>ViziCloud</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <span class="logo">
    <img src="icons/icon.svg" alt="" aria-hidden="true" style="width:28px;height:28px;vertical-align:middle;margin-right:0.4rem;border-radius:6px;">ViziCloud
    <span id="commit-ref" class="commit-ref"></span>
  </span>
  <select id="album-select" class="album-select" style="display:none" aria-label="Choisir un album"></select>
  <span class="badge" id="count-badge">Chargement…</span>
  <button class="icon-btn" id="upload-btn" title="Ajouter des photos" aria-label="Ajouter des photos" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
  <input type="file" id="upload-input" accept="image/*,video/*" multiple style="display:none">
  <button class="icon-btn" id="settings-btn" title="Paramètres" aria-label="Ouvrir les paramètres">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span class="filter-active-dot" aria-hidden="true"></span>
  </button>
</header>

<div class="status-bar" id="status-bar">
  <div class="spinner"></div>
  <span id="status-text">Connexion à iCloud…</span>
</div>

<main>
  <div class="gallery" id="gallery"></div>
  <div id="scroll-sentinel"></div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visionneuse photo">
  <div class="lb-header">
    <button class="lb-btn" id="lb-back" title="Retour" aria-label="Retour à la galerie">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="lb-counter" id="lb-counter"></span>
    <div class="lb-actions">
      <button class="lb-btn" id="lb-download-btn" title="Télécharger" aria-label="Télécharger">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="lb-btn" id="lb-close" title="Fermer" aria-label="Fermer">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <div class="lb-image-wrap" id="lb-wrap">
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="Photo précédente">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img id="lb-img" src="" alt="">
    <video id="lb-video" controls playsinline></video>
    <button class="lb-nav lb-next" id="lb-next" aria-label="Photo suivante">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="lb-footer">
    <p class="lb-caption" id="lb-caption"></p>
    <p class="lb-date" id="lb-date"></p>
  </div>
</div>

<div class="update-banner" id="update-banner">
  <span>Nouvelle version disponible</span>
  <button class="btn-update">Mettre à jour</button>
</div>

<div class="toast" id="toast"></div>

<!-- Settings panel -->
<div class="settings-overlay" id="settings-overlay"></div>
<aside class="settings-panel" id="settings-panel" aria-label="Paramètres">
  <div class="settings-header">
    <h2>Paramètres</h2>
    <button class="lb-btn" id="settings-close" aria-label="Fermer les paramètres">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="settings-body">
    <section class="settings-section" id="filter-section" style="display:none">
      <h3>Filtres</h3>
      <div class="filter-group" id="contrib-group" style="display:none">
        <p class="filter-group-label">Contributeur</p>
        <div class="filter-chips" id="contrib-chips"></div>
      </div>
      <div class="filter-group" id="year-group" style="display:none">
        <p class="filter-group-label">Période</p>
        <div class="filter-chips" id="year-chips"></div>
      </div>
      <button class="btn" id="filter-clear" style="margin-top:0.25rem;width:100%;justify-content:center" disabled>Tout afficher</button>
    </section>
    <section class="settings-section" id="notif-section">
      <h3>Notifications</h3>
      <div class="settings-row">
        <span>Nouvelles photos</span>
        <label class="toggle">
          <input type="checkbox" id="notif-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p class="settings-sub" id="notif-label"></p>
    </section>
    <section class="settings-section">
      <h3>À propos</h3>
      <div class="settings-row">
        <span>Commit</span>
        <span class="settings-muted" id="settings-commit">—</span>
      </div>
    </section>
  </div>
</aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
